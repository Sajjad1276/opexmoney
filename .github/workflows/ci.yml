name: OPEX MONEY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: test-token
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify migration downgrade
        run: |
          alembic downgrade 0002_founder_constraints
          alembic upgrade head

      - name: Health contract - route callback coverage
        id: flow_health
        run: pytest -q tests/test_flow_health.py::test_global_flow_contract_has_no_orphaned_controls

      - name: Diagnose flow health failure
        if: ${{ steps.flow_health.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from urllib.parse import quote

          from app.diagnostics.flow_health import run_flow_health_test

          report = run_flow_health_test()
          body = {
              "run": os.environ.get("GITHUB_RUN_ID"),
              "errors": report.errors,
              "warnings": report.warnings,
              "metrics": report.metrics,
          }
          title = "OPEX CI flow-health diagnostics"
          body_text = "```json\n" + json.dumps(body, ensure_ascii=False, indent=2) + "\n```"
          headers = {
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          query = quote(f'repo:Sajjad1276/opexmoney is:issue is:open in:title "{title}"')
          with urllib.request.urlopen(
              urllib.request.Request(
                  f"https://api.github.com/search/issues?q={query}",
                  headers=headers,
                  method="GET",
              ),
              timeout=15,
          ) as response:
              matches = json.loads(response.read().decode("utf-8")).get("items", [])

          if matches:
              issue_number = matches[0]["number"]
              payload = json.dumps({"body": body_text}).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/Sajjad1276/opexmoney/issues/{issue_number}",
                  data=payload,
                  headers=headers,
                  method="PATCH",
              )
          else:
              payload = json.dumps({"title": title, "body": body_text}).encode("utf-8")
              request = urllib.request.Request(
                  "https://api.github.com/repos/Sajjad1276/opexmoney/issues",
                  data=payload,
                  headers=headers,
                  method="POST",
              )

          with urllib.request.urlopen(request, timeout=15) as response:
              print(response.read().decode("utf-8"))
          PY
      - name: Health contract - keyboard factories
        run: pytest -q tests/test_flow_health.py -k "all_inline_keyboard_factories"

      - name: Health contract - dynamic keyboard callbacks
        run: pytest -q tests/test_flow_health.py::test_dynamic_keyboard_callbacks_are_not_empty

      - name: Health contract - reply keyboard
        run: pytest -q tests/test_flow_health.py -k "main_reply_keyboard or required_main_menu_sections"

      - name: Identity sequence journey
        run: pytest -q tests/test_identity_sequences.py

      - name: Onboarding journey
        id: onboarding_journey
        run: pytest -q tests/test_onboarding_flow.py

      - name: Diagnose onboarding failure
        if: ${{ steps.onboarding_journey.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pytest -q tests/test_onboarding_flow.py -vv --tb=long > onboarding_failure.txt 2>&1
          python - <<'PY'
          import json
          import os
          import urllib.request
          from urllib.parse import quote

          with open('onboarding_failure.txt', encoding='utf-8') as handle:
              output = handle.read()

          title = "OPEX CI onboarding diagnostics"
          body_text = "```text\n" + output[-12000:] + "\n```"
          headers = {
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          query = quote(f'repo:Sajjad1276/opexmoney is:issue is:open in:title "{title}"')
          with urllib.request.urlopen(
              urllib.request.Request(
                  f'https://api.github.com/search/issues?q={query}',
                  headers=headers,
                  method='GET',
              ),
              timeout=15,
          ) as response:
              matches = json.loads(response.read().decode('utf-8')).get('items', [])

          if matches:
              issue_number = matches[0]['number']
              payload = json.dumps({'body': body_text}).encode('utf-8')
              request = urllib.request.Request(
                  f"https://api.github.com/repos/Sajjad1276/opexmoney/issues/{issue_number}",
                  data=payload,
                  headers=headers,
                  method='PATCH',
              )
          else:
              payload = json.dumps({'title': title, 'body': body_text}).encode('utf-8')
              request = urllib.request.Request(
                  'https://api.github.com/repos/Sajjad1276/opexmoney/issues',
                  data=payload,
                  headers=headers,
                  method='POST',
              )

          with urllib.request.urlopen(request, timeout=15) as response:
              print(response.read().decode('utf-8'))
          PY
          exit 0
      - name: Market journey
        run: pytest -q tests/test_market_flow.py

      - name: Nation management journey
        run: pytest -q tests/test_nation_management_flow.py

      - name: Core integration tests
        run: pytest -q tests/test_ai_layer.py tests/test_architecture.py tests/test_founder_integration.py tests/test_governance_phase2.py

      - name: Full test suite
        run: pytest -q

      - name: Close resolved CI diagnostic issues
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = "Sajjad1276/opexmoney"
          query = urllib.parse.quote(
              f"repo:{repository} is:issue is:open in:title \"OPEX CI\""
          )
          headers = {
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          with urllib.request.urlopen(
              urllib.request.Request(
                  f"https://api.github.com/search/issues?q={query}&per_page=100",
                  headers=headers,
                  method="GET",
              ),
              timeout=15,
          ) as response:
              issues = json.loads(response.read().decode("utf-8")).get("items", [])

          for issue in issues:
              if issue.get("user", {}).get("login") != "github-actions[bot]":
                  continue

              number = issue["number"]
              payload = json.dumps(
                  {"state": "closed", "state_reason": "completed"}
              ).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/issues/{number}",
                  data=payload,
                  headers=headers,
                  method="PATCH",
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  response.read()
              print(f"Closed CI diagnostic issue #{number}: {issue['title']}")
          PY
