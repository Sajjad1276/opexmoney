name: OPEX MONEY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: test-token
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Apply migrations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          alembic upgrade head > migration_upgrade.log 2>&1
          STATUS=$?
          cat migration_upgrade.log
          if [ "$STATUS" -ne 0 ]; then
            python - <<'PY'
            import json
            import os
            import urllib.request

            with open("migration_upgrade.log", encoding="utf-8") as handle:
                output = handle.read()
            payload = json.dumps({
                "title": f"OPEX CI migration diagnostics run {os.environ.get('GITHUB_RUN_ID')}",
                "body": "```text\n" + output[-12000:] + "\n```",
            }).encode("utf-8")
            request = urllib.request.Request(
                "https://api.github.com/repos/Sajjad1276/opexmoney/issues",
                data=payload,
                headers={
                    "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                    "Content-Type": "application/json",
                },
                method="POST",
            )
            with urllib.request.urlopen(request, timeout=15) as response:
                print(response.read().decode("utf-8"))
            PY
          fi
          exit "$STATUS"

      - name: Verify migration downgrade
        run: |
          alembic downgrade 0002_founder_constraints
          alembic upgrade head

      - name: Health contract - route callback coverage
        run: pytest -q tests/test_flow_health.py::test_global_flow_contract_has_no_orphaned_controls

      - name: Diagnose flow health failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          from app.diagnostics.flow_health import run_flow_health_test

          report = run_flow_health_test()
          body = {
              "run": os.environ.get("GITHUB_RUN_ID"),
              "errors": report.errors,
              "warnings": report.warnings,
              "metrics": report.metrics,
          }
          payload = json.dumps({
              "title": f"OPEX CI flow-health diagnostics run {os.environ.get('GITHUB_RUN_ID')}",
              "body": "```json\n" + json.dumps(body, ensure_ascii=False, indent=2) + "\n```"
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.github.com/repos/Sajjad1276/opexmoney/issues",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              print(response.read().decode("utf-8"))
          PY
      - name: Health contract - keyboard factories
        run: pytest -q tests/test_flow_health.py -k "all_inline_keyboard_factories"

      - name: Health contract - dynamic keyboard callbacks
        run: pytest -q tests/test_flow_health.py::test_dynamic_keyboard_callbacks_are_not_empty

      - name: Health contract - reply keyboard
        run: pytest -q tests/test_flow_health.py -k "main_reply_keyboard or required_main_menu_sections"

      - name: Identity sequence journey
        run: pytest -q tests/test_identity_sequences.py

      - name: Onboarding journey
        run: pytest -q tests/test_onboarding_flow.py

      - name: Diagnose onboarding failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          pytest -q tests/test_onboarding_flow.py -vv --tb=long > onboarding_failure.txt 2>&1
          STATUS=$?
          python - <<'PY'
          import json
          import os
          import urllib.request

          with open('onboarding_failure.txt', encoding='utf-8') as handle:
              output = handle.read()
          payload = json.dumps({
              'title': f"OPEX CI onboarding diagnostics run {os.environ.get('GITHUB_RUN_ID')}",
              'body': '```text\n' + output[-12000:] + '\n```'
          }).encode('utf-8')
          request = urllib.request.Request(
              'https://api.github.com/repos/Sajjad1276/opexmoney/issues',
              data=payload,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              print(response.read().decode('utf-8'))
          PY
          exit 0
      - name: Market journey
        run: pytest -q tests/test_market_flow.py

      - name: Nation management journey
        run: pytest -q tests/test_nation_management_flow.py

      - name: Core integration tests
        run: pytest -q tests/test_ai_layer.py tests/test_architecture.py tests/test_founder_integration.py tests/test_governance_phase2.py

      - name: Full test suite
        run: pytest -q
