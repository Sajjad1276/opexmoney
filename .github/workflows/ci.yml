name: OPEX MONEY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BOT_TOKEN: test-token
      ALLOW_MEMORY_FSM_DEV: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Apply migrations
        run: alembic upgrade head
      - name: Verify migration downgrade
        run: |
          alembic downgrade 0002_founder_constraints
          alembic upgrade head
      - name: Run tests
        run: pytest -q -s
