name: phase2-static-check

on:
  push:
    branches:
      - rebuild/phase-2-membership-engine
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q app main.py scripts alembic
