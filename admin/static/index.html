<style>
:root{--bg-primary:#0f0f13;--bg-card:#1e1e2e;--gold:#EF9F27;--green:#4ade80;--red:#f87171;--blue:#60a5fa;--text-primary:#e8e8f0;--text-muted:#6b7280;--border:#2a2a3e;--bg-secondary:#15151d;--bg-card-hover:#252538;--border-accent:rgba(239,159,39,.4);--text-secondary:#a4a4b5;--gold-dim:#b87b1e}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);overflow:hidden;position:relative}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{height:100vh;display:flex}.sidebar{width:240px;flex:none;background:var(--bg-secondary);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px}.logo{display:flex;align-items:center;gap:9px;padding:10px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:12px}.logo b{font-size:18px}.logo small{display:block;color:var(--text-muted);margin-top:2px}.logo i{font-style:normal;font-size:30px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:var(--text-secondary);padding:10px;border-radius:10px;text-align:right;display:flex;align-items:center;gap:9px}.nav button:hover,.nav button.active{background:rgba(239,159,39,.09);border-color:var(--border-accent);color:var(--gold)}.badge{margin-right:auto;min-width:22px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.08);font-size:11px;text-align:center}.badge.red{color:var(--red)}.badge.amber{color:var(--gold)}.status{margin-top:auto;border-top:1px solid var(--border);padding:14px 7px 4px;color:var(--text-secondary);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:6px;animation:pulse 2s infinite}@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}}
.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border)}.topbar h1{margin:0;font-size:18px}.topbar p{margin:3px 0 0;font-size:11px;color:var(--text-muted)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--border);background:var(--bg-card);color:var(--text-primary);border-radius:9px;padding:8px 11px}.btn:hover{background:var(--bg-card-hover)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1309}.btn.red{color:var(--red);border-color:rgba(248,113,113,.25);background:rgba(248,113,113,.08)}
.content{flex:1;overflow-y:auto;padding:20px}.dev{display:none;background:rgba(239,159,39,.08);border:1px solid var(--border-accent);color:var(--gold);padding:9px 11px;border-radius:10px;margin-bottom:12px}.section{display:none}.section.active{display:block}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--bg-card);border:1px solid var(--border);border-radius:13px}.panel{padding:15px;margin-top:12px}.stat{padding:16px}.stat small,.muted{color:var(--text-muted)}.stat .n{font-size:27px;font-weight:700;margin-top:6px}.stat .s{font-size:11px;color:var(--text-secondary);margin-top:4px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.head h3{margin:0;font-size:15px}.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.gauge label{font-size:11px;color:var(--text-secondary);display:flex;justify-content:space-between;margin-bottom:5px}.bar{height:8px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;transition:width .8s ease}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px}.table th{text-align:right;color:var(--text-muted);font-weight:500}.table tr:hover td{background:rgba(255,255,255,.015)}.pill{display:inline-block;padding:3px 8px;border-radius:99px;font-size:10px;border:1px solid var(--border);background:rgba(255,255,255,.03)}.pill.green{color:var(--green);background:rgba(74,222,128,.08)}.pill.red{color:var(--red);background:rgba(248,113,113,.08)}.pill.gold{color:var(--gold);background:rgba(239,159,39,.08)}.pill.blue{color:var(--blue);background:rgba(96,165,250,.08)}.pos{color:var(--green)}.neg{color:var(--red)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none}.grow{flex:1;min-width:180px}.field{margin-bottom:11px}.field label{display:block;color:var(--text-secondary);font-size:11px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:90px;resize:vertical}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick .btn{min-height:66px}.feed{display:grid;gap:8px}.feed div{border:1px solid var(--border);border-radius:9px;padding:8px;font-size:12px}.chart{height:320px}.chart canvas{width:100%!important;height:100%!important}.skeleton{background:linear-gradient(90deg,var(--bg-card) 25%,rgba(255,255,255,.05) 50%,var(--bg-card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.nations{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.nation{padding:14px;cursor:pointer}.nation:hover{background:var(--bg-card-hover)}.nationtop{display:flex;align-items:center;gap:9px}.flag{font-size:28px}.rate{font-size:20px;font-weight:700;margin-top:14px}.wars{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.war{padding:14px}.sides{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;text-align:center}.power{display:flex;height:8px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;margin:12px 0}.power i{display:block}.a{background:var(--gold)}.b{background:var(--blue)}.events{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.actiongrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.actioncard{padding:15px}.loglist{display:grid;gap:9px}.log{padding:12px;border-right:3px solid var(--gold-dim);background:var(--bg-card);border-radius:9px}.pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}.empty,.error{padding:24px;text-align:center;color:var(--text-secondary);border:1px dashed var(--border);border-radius:10px}.error{color:var(--red)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.overlay.show{display:flex}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:15px}.modalhead,.modalfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 15px;border-bottom:1px solid var(--border)}.modalhead h3{margin:0;font-size:15px}.modalbody{padding:15px}.modalfoot{border-bottom:0;border-top:1px solid var(--border);justify-content:flex-start}.preview{display:none;margin:0 15px 12px;padding:9px;border-radius:8px;background:rgba(239,159,39,.08);border:1px solid var(--border-accent);color:var(--gold);font-size:12px}.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:none;padding:11px 14px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border);z-index:70}.toast.show{display:block}.toast.ok{color:var(--green)}.toast.err{color:var(--red)}.kpis{display:flex;gap:14px;flex-wrap:wrap}.kpis>div{min-width:100px}.detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini{background:var(--bg-secondary);border:1px solid var(--border);border-radius:9px;padding:10px}.mini small{color:var(--text-muted)}.mini strong{display:block;margin-top:4px}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.nations,.wars,.events,.actiongrid{grid-template-columns:1fr 1fr}.gauges{grid-template-columns:1fr 1fr}}@media(max-width:780px){.sidebar{width:70px;padding:8px}.logo b,.logo small,.nav .label,.nav .badge,.status .txt{display:none}.logo{justify-content:center}.nav button{justify-content:center}.content{padding:11px}.grid2,.nations,.wars,.events,.actiongrid{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.detailgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid4,.gauges{grid-template-columns:1fr}.topbar{padding:0 10px}.actions .btn span{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="logo"><div><b>OPEX MONEY</b><small>پنل فرماندهی</small></div></div>
<nav class="nav">
<button data-s="overview" class="active"> <span class="label">داشبورد</span></button>
<button data-s="economy"> <span class="label">اقتصاد</span></button>
<button data-s="market"><span class="label">بازار</span></button>
<button data-s="players"> <span class="label">بازیکنان</span><em id="bp" class="badge">0</em></button>
<button data-s="nations"> <span class="label">ملت‌ها</span></button>
<button data-s="wars"> <span class="label">جنگ‌ها</span><em id="bw" class="badge red">0</em></button>
<button data-s="governance"> <span class="label">حکمرانی</span><em id="bg" class="badge amber">0</em></button>
<button data-s="transactions"> <span class="label">تراکنش‌ها</span></button>
<button data-s="actions"> <span class="label">اقدامات</span></button>
<button data-s="logs"> <span class="label">لاگ‌ها</span></button>
</nav><div class="status"><span class="dot"></span><span class="txt">ربات آنلاین</span></div></aside>
<main class="main"><header class="topbar"><div><h1 id="title">داشبورد</h1><p id="sub">تصویر کلی زنده از بازی</p></div><div class="actions"><button class="btn" id="refresh"> <span>رفرش</span></button><button class="btn" id="export"> <span>گزارش</span></button><button class="btn gold" id="announce"> <span>اعلامیه</span></button></div></header>
<div class="content"><div id="dev" class="dev">حالت توسعه: این پنل خارج از تلگرام باز شده است</div>
<section id="overview" class="section active"></section><section id="economy" class="section"></section><section id="market" class="section"></section><section id="players" class="section"></section><section id="nations" class="section"></section><section id="wars" class="section"></section><section id="governance" class="section"></section><section id="transactions" class="section"></section><section id="actions" class="section"></section><section id="logs" class="section"></section></div></main></div>
<div id="overlay" class="overlay"><div class="modal"><div class="modalhead"><h3 id="mtitle">اقدام</h3><button class="btn" id="mclose">بستن</button></div><div id="mbody" class="modalbody"></div><div id="preview" class="preview"></div><div class="modalfoot"><button class="btn" id="mcancel">لغو</button><button class="btn" id="mpreview">پیش‌نمایش</button><button class="btn gold" id="mexec" style="display:none">تایید و اجرا</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand();}
const initData=window.Telegram?.WebApp?.initData||'';const ADMIN_API_BASE=String(window.ADMIN_API_URL||'').replace(/\/+$/,'');const qp=new URLSearchParams(location.search);const devId=qp.get('dev_admin_id')||localStorage.getItem('opex_dev_admin_id')||'';
const S={section:'overview',data:{},playersPage:1,nationsPage:1,txPage:1,logsPage:1,playerFilter:'active',nationFilter:'active',warFilter:'active',govStatus:'voting',playerSort:'balance',txLimit:50,logAuto:false};const charts={};const timers={count:null,logs:null,overview:null};
const meta={overview:['داشبورد','تصویر کلی زنده از بازی'],economy:['اقتصاد','سلامت اقتصاد و رویدادهای فعال'],market:['بازار','تاریخچه و رفتار نرخ‌ها'],players:['بازیکنان','مدیریت بازیکنان و هوش مصنوعی'],nations:['ملت‌ها','وضعیت ملت‌ها و قدرت اقتصادی'],wars:['جنگ‌ها','نبردهای فعال و تاریخچه'],governance:['حکمرانی','پیشنهادها، قواعد و دفتر تغییرات'],transactions:['تراکنش‌ها','جریان مالی بازی'],actions:['اقدامات','عملیات حساس مدیر'],logs:['لاگ‌ها','ردپای قابل ممیزی اقدامات']};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function fa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function fmt(n){n=Number(n)||0;return Math.abs(n)>=1e6?(n/1e6).toFixed(1)+'M':Math.abs(n)>=1e3?(n/1e3).toFixed(1)+'K':n.toLocaleString('fa-IR')}function rate(n){return(Number(n)||0).toFixed(4)}function ago(x){const d=Math.max(0,Math.floor((Date.now()-new Date(x).getTime())/1000));return d<60?'همین الان':d<3600?fa(Math.floor(d/60))+' دقیقه پیش':d<86400?fa(Math.floor(d/3600))+' ساعت پیش':fa(Math.floor(d/86400))+' روز پیش'}function datefmt(x){return x?new Date(x).toLocaleString('fa-IR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'}function cd(x){let d=Math.floor((new Date(x).getTime()-Date.now())/1000);if(d<=0)return'پایان یافت';const D=Math.floor(d/86400);d%=86400;const H=Math.floor(d/3600);d%=3600;const M=Math.floor(d/60);return(D?fa(D)+' روز ':'')+(H?fa(H)+' ساعت ':'')+fa(M)+' دقیقه'}function toast(m,c){const t=$('toast');t.textContent=m;t.className='toast '+(c||'')+' show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='toast',3000)}
const formatNumber=fmt,timeAgo=ago,countdown=cd,formatRate=rate;
function clearIntervals(){if(timers.count){clearInterval(timers.count);timers.count=null}if(timers.logs){clearInterval(timers.logs);timers.logs=null}if(timers.overview){clearInterval(timers.overview);timers.overview=null}}function startCount(){if(timers.count)clearInterval(timers.count);timers.count=setInterval(()=>document.querySelectorAll('[data-cd]').forEach(e=>e.textContent=countdown(e.dataset.cd)),1000)}function killCharts(){Object.keys(charts).forEach(k=>{try{charts[k].destroy()}catch(e){}delete charts[k]})}function makeUrl(path){if(/^https?:\/\//i.test(path))return path;return ADMIN_API_BASE+(path.startsWith('/')?path:'/'+path)}
const api={async request(method,path,body=null){const h={'Content-Type':'application/json','X-Telegram-Init-Data':initData};if(!initData&&devId)h['X-Dev-Admin-Id']=devId;const r=await fetch(makeUrl(path),{method,headers:h,body:body===null?null:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)throw new Error('دوباره از تلگرام باز کن');if(r.status===429)throw new Error('کمی صبر کن');if(r.status>=500&&r.status<600)throw new Error('خطای سرور — لاگ را بررسی کن');throw new Error(Array.isArray(d.detail)?JSON.stringify(d.detail):d.detail||d.error||('HTTP '+r.status))}return d},get:p=>api.request('GET',p),post:(p,b)=>api.request('POST',p,b)};
if(!initData)$('dev').style.display='block';
function skeleton(h='height:120px'){return'<div class="card skeleton" style="'+h+'"></div>'}function gauge(n,v){const x=Math.max(0,Math.min(100,Number(v)||0));const c=x>=70?'var(--green)':x>=40?'var(--gold)':'var(--red)';return'<div class="gauge"><label><span>'+n+'</span><b>'+rate(x)+'%</b></label><div class="bar"><div class="fill" style="width:'+x+'%;background:'+c+'"></div></div></div>'}
function go(sec){clearIntervals();killCharts();S.section=sec;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===sec));document.querySelectorAll('.section').forEach(e=>e.classList.toggle('active',e.id===sec));$('title').textContent=meta[sec][0];$('sub').textContent=meta[sec][1];load()}
async function load(){try{await ({overview, economy, market, players, nations, wars, governance, transactions, actions:renderActions, logs}[S.section])()}catch(e){document.getElementById(S.section).innerHTML='<div class="error">'+esc(e.message)+'</div>'}}

async function overview(){
 const el=$('overview');if(timers.overview)clearInterval(timers.overview);el.innerHTML='<div class="grid4">'+Array.from({length:4},()=>skeleton('height:110px')).join('')+'</div>'+skeleton('height:210px')+'<div class="grid2">'+skeleton('height:320px')+skeleton('height:320px')+'</div>';
 try{
  const[o,h,events]=await Promise.all([api.get('/api/stats/overview'),api.get('/api/stats/economy-health'),api.get('/api/economy/world-events?active_only=false')]);
  S.data.overview={o,h,events};$('bp').textContent=formatNumber(o.total_players);$('bw').textContent=formatNumber(o.active_wars);$('bg').textContent=formatNumber(o.pending_proposals);
  const stat=(a,b,c,k)=>'<div class="card stat"><small>'+a+'</small><div class="n '+(k||'')+'">'+b+'</div><div class="s">'+c+'</div></div>';
  const score=Math.max(0,Math.min(100,Math.round((Number(h.market_confidence||0)+Number(h.total_liquidity||0)+Number(h.market_stability||0)+(100-Math.min(100,Math.abs(Number(h.inflation_rate||0))))+(100-Math.min(100,Number(h.wealth_concentration||0))))/5)));
  const color=score>70?'var(--green)':score>=40?'var(--gold)':'var(--red)';
  const ev=(events||[]).slice().sort((a,b)=>new Date(b.started_at)-new Date(a.started_at)).slice(0,10);
  el.innerHTML='<div class="grid4">'+stat('کل بازیکنان',formatNumber(o.total_players),formatNumber(o.active_players_24h)+' فعال در ۲۴ ساعت')+stat('ملت‌های فعال',formatNumber(o.total_nations),'ملت ثبت‌شده')+stat('تراکنش امروز',formatNumber(o.transactions_today),formatNumber(o.transaction_volume_today)+' حجم امروز')+stat('جنگ‌های فعال',formatNumber(o.active_wars),o.active_wars?'درگیری جاری':'بدون جنگ فعال',o.active_wars?'neg':'pos')+'</div><div class="card panel"><div class="head"><h3>سلامت اقتصاد</h3><strong style="color:'+color+'">'+fa(score)+'/۱۰۰</strong></div><div class="bar" style="height:14px"><div class="fill" style="width:'+score+'%;background:'+color+'"></div></div><div class="gauges" style="margin-top:14px">'+gauge('اعتماد بازار',h.market_confidence)+gauge('نقدینگی',h.total_liquidity)+gauge('ثبات بازار',h.market_stability)+gauge('نوسان معکوس',100-Math.min(100,Number(h.avg_volatility||0)))+gauge('تمرکز معکوس',100-Math.min(100,Number(h.wealth_concentration||0)))+gauge('اثر تورم',Math.max(0,100-Math.min(100,Math.abs(Number(h.inflation_rate||0)))))+'</div></div><div class="grid2"><div class="card panel"><div class="head"><h3>آخرین رویدادهای جهان</h3><span class="muted">۱۰ رویداد</span></div><div class="feed">'+(ev.length?ev.map(x=>'<div><div class="head"><b>'+esc(x.title)+'</b><span class="pill '+(x.is_active?'green':'')+'">'+(x.is_active?'فعال':'پایان‌یافته')+'</span></div><div class="muted">'+esc(x.description)+'</div><div style="margin-top:6px">'+(x.is_active?'<span class="muted">تا </span><span data-cd="'+esc(x.ends_at)+'">'+countdown(x.ends_at)+'</span>':timeAgo(x.ends_at))+'</div></div>').join(''):'<div class="empty">رویدادی ثبت نشده است</div>')+'</div></div><div class="card panel"><div class="head"><h3>اقدامات سریع</h3></div><div class="quick"><button class="btn" data-q="broadcast">اعلامیه عمومی</button><button class="btn" data-q="event">ایجاد رویداد</button><button class="btn" data-q="bonus">اعطای جایزه</button><button class="btn" data-q="export">گزارش CSV</button></div></div></div>';
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=b.dataset.q;if(q==='export')return exportData();openAction(q)});startCount();timers.overview=setInterval(()=>{if(S.section==='overview')overview()},30000);
 }catch(e){el.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

async function economy(){

  '<div class="card panel"><div class="head"><h3>دفتر حکمرانی</h3><span class="muted">'+formatNumber(l.total)+' رکورد</span></div><div class="tablewrap"><table class="table"><thead><tr><th>زمان</th><th>اجراکننده</th><th>عملیات</th><th>قاعده</th><th>تغییر</th><th>دلیل</th></tr></thead><tbody>'+((l.items||[]).length?l.items.map(x=>'<tr><td>'+datefmt(x.at)+'</td><td>'+esc(x.actor_username||'سیستم')+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.rule_key)+'</td><td>'+esc(x.old_value||'')+' ← '+esc(x.new_value||'')+'</td><td>'+esc(x.reason||'')+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">رکوردی وجود ندارد</td></tr>')+'</tbody></table></div></div>';
  document.querySelectorAll('[data-gv]').forEach(b=>b.onclick=()=>{S.govStatus=b.dataset.gv;governance()});startCount();
 }catch(e){el.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

async function transactions(){const el=$('transactions');el.innerHTML=skeleton('height:570px');try{const q=new URLSearchParams({page:S.txPage,limit:S.txLimit});if(S.txFrom)q.set('from_date',S.txFrom);if(S.txTo)q.set('to_date',S.txTo);if(S.txNation)q.set('nation_id',S.txNation);if(S.txType)q.set('type',S.txType);if(S.txUserId)q.set('user_id',S.txUserId);const r=await api.get('/api/transactions?'+q);S.data.transactions=r;const n=(S.data.nations?.items)||[];el.innerHTML='<div class="card panel"><div class="toolbar"><input id="tf" type="date" value="'+esc(S.txFrom||'')+'"><input id="tt" type="date" value="'+esc(S.txTo||'')+'"><select id="tn"><option value="">همه ملت‌ها</option>'+n.map(x=>'<option value="'+x.nation_id+'">'+esc(x.name)+'</option>').join('')+'</select><select id="ty"><option value="">همه</option><option value="buy">خرید</option><option value="sell">فروش</option></select><input class="grow" id="tu" placeholder="شناسه یا نام کاربری"><button class="btn" id="ta">اعمال</button><select id="tl"><option>20</option><option selected>50</option><option>100</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>ملت</th><th>نوع</th><th>مقدار</th><th>دلار</th><th>نرخ</th><th>کارمزد</th><th>زمان</th></tr></thead><tbody>'+r.items.map((x,i)=>'<tr><td>'+((r.page-1)*r.items.length+i+1)+'</td><td>'+(x.nation_flag||'')+' '+esc(x.nation_name)+'</td><td><span class="pill '+(x.transaction_type==='buy'?'green':'red')+'">'+esc(x.transaction_type)+'</span></td><td>'+fmt(x.amount)+'</td><td>'+fmt(x.spend_xr)+'</td><td>'+rate(x.rate)+'</td><td>'+fmt(x.fee_xr)+'</td><td>'+datefmt(x.created_at)+'</td></tr>').join('')+'</tbody></table></div><div class="pagination"><button class="btn" id="tp">قبلی</button><span>'+fmt(r.total)+' تراکنش · '+r.page+'/'+(r.pages||0)+'</span><button class="btn" id="tnext">بعدی</button></div></div>';if($('tn'))$('tn').value=S.txNation||'';$('ty').value=S.txType||'';$('tl').value=String(S.txLimit);$('ta').onclick=async()=>{S.txFrom=$('tf').value;S.txTo=$('tt').value;S.txNation=$('tn').value;S.txType=$('ty').value;const raw=$('tu').value.trim();if(raw&&/^\\d+$/.test(raw))S.txUserId=raw;else if(raw){const p=await api.get('/api/players?page=1&limit=1&filter=all&search='+encodeURIComponent(raw));if(!p.items.length)throw new Error('بازیکن پیدا نشد');S.txUserId=p.items[0].user_id}else S.txUserId='';S.txPage=1;transactions()};$('tl').onchange=e=>{S.txLimit=Number(e.target.value);S.txPage=1;transactions()};$('tp').onclick=()=>{if(S.txPage>1){S.txPage--;transactions()}};$('tnext').onclick=()=>{if(S.txPage<(r.pages||1)){S.txPage++;transactions()}}}catch(e){el.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}

function renderActions(){
 const data=[['اعلامیه عمومی','ارسال پیام همگانی به بازیکنان','متوسط','broadcast'],['اعطای جایزه','افزایش موجودی دلار بازیکنان','کم','bonus'],['مسدود کردن بازیکن','مسدودسازی یک بازیکن','بالا','ban'],['رفع مسدودیت','رفع مسدودیت یک بازیکن','کم','unban'],['ریست نرخ‌ها','تغییر دستی نرخ ملت‌ها','بالا','rates'],['پایان جنگ','اتمام جنگ با نتیجه مشخص','متوسط','war'],['ایجاد رویداد','ایجاد رویداد اقتصادی جهان','متوسط','event'],['ارسال جایزه مأموریت','اعطای دستی جایزه مأموریت','کم','mission']];
 $('actions').innerHTML='<div class="actiongrid">'+data.map(x=>'<div class="card actioncard"><h3>'+x[0]+'</h3><div class="muted">'+x[1]+'</div><div class="head" style="margin-top:12px"><span class="pill '+(x[2]==='بالا'?'red':x[2]==='متوسط'?'gold':'green')+'">ریسک: '+x[2]+'</span><button class="btn '+(x[2]==='بالا'?'red':'')+'" data-act="'+x[3]+'">اجرا</button></div></div>').join('')+'</div>';
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>openAction(b.dataset.act));
}

function fields(type,d){const area=(id,label,attrs='')=>'<div class="field"><label>'+label+'</label><input id="'+id+'" '+attrs+'></div>';if(type==='broadcast')return '<div class="field"><label>پیام</label><textarea id="fmsg" maxlength="4096"></textarea></div>'+area('fparse','شیوه نمایش')+'<div class="field"><label>هدف</label><select id="ftarget"><option value="active_only">بازیکنان فعال</option><option value="all">همه بازیکنان</option></select></div>';if(type==='bonus')return area('fusers','شناسه‌ها با ویرگول یا all','value="all"')+area('famount','مقدار دلار','type="number" min="0.0001" max="100000" step="0.01"')+area('fnote','یادداشت','maxlength="255"');if(type==='ban')return area('fuid','شناسه بازیکن','type="number" value="'+esc(d?.user_id||'')+'"')+'<div class="field"><label>نوع عملیات</label><select id="fmode"><option value="ban">بن</option><option value="unban">آنبن</option></select></div>'+area('freason','دلیل','maxlength="255"');if(type==='unban')return area('fuid','شناسه بازیکن','type="number" value="'+esc(d?.user_id||'')+'"');if(type==='rates')return area('fnid','شناسه ملت یا all','value="all"')+area('frate','نرخ جدید','type="number" min="0.0001" max="1000" step="0.0001"')+area('freason','دلیل','maxlength="255"');if(type==='war')return area('fwid','شناسه جنگ','type="number" value="'+esc(d?.war_id||'')+'"')+'<div class="field"><label>نتیجه</label><select id="fresult"><option value="nation_wins">پیروزی مهاجم</option><option value="opponent_wins">پیروزی مدافع</option><option value="draw">مساوی</option></select></div>'+area('freason','دلیل','maxlength="255"')+'<div><input id="fcheck" type="checkbox"> مطمئنم که می‌خواهم جنگ پایان یابد.</div>';if(type==='event')return '<div class="field"><label>نوع رویداد</label><select id="fevent">'+['economic_crisis','trade_deal','investor_entry','investor_exit','resource_discovery','market_boom','market_crash','political_change','nation_founded','nation_dissolved','war_declared','peace_signed'].map(v=>'<option>'+v+'</option>').join('')+'</select></div><div class="field"><label>scope</label><select id="fscope"><option value="local">محلی</option><option value="national">ملی</option><option value="global">جهانی</option></select></div>'+area('ftitle','عنوان','maxlength="200"')+'<div class="field"><label>شرح</label><textarea id="fdesc" maxlength="2000"></textarea></div><div class="field"><label>اثر</label><select id="feffect"><option value="rate_boost">افزایش نرخ</option><option value="rate_drop">کاهش نرخ</option><option value="liquidity_change">تغییر نقدینگی</option><option value="confidence_change">تغییر اعتماد</option><option value="treasury_impact">اثر خزانه</option></select></div>'+area('fmag','شدت','type="number" min="0.01" max="10" step="0.1"')+area('fdur','مدت دقیقه','type="number" min="1" max="10080" value="60"')+area('fnid','شناسه ملت اختیاری','type="number"')+area('fcurrency','ارز متاثر','maxlength="4"');if(type==='mission')return area('fusers','شناسه بازیکنان با ویرگول')+area('fmission','کلید ماموریت')+area('foverride','دلار جایگزین اختیاری','type="number" min="0.0001" step="0.01"');return ''}
function payload(type){const nums=s=>s.split(',').map(x=>Number(x.trim())).filter(Number.isFinite);if(type==='broadcast')return{message:$('fmsg').value,parse_mode:'HTML',target:$('ftarget').value};if(type==='bonus'){const s=$('fusers').value.trim();return{user_ids:s==='all'?'all':nums(s),amount_xr:Number($('famount').value),note:$('fnote').value};}if(type==='ban'){return{user_id:Number($('fuid').value),reason:$('freason').value};}if(type==='unban')return{user_id:Number($('fuid').value)};if(type==='rates'){const n=$('fnid').value.trim();return{nation_id:n==='all'?'all':Number(n),new_rate:Number($('frate').value),reason:$('freason').value};}if(type==='war')return{war_id:Number($('fwid').value),result:$('fresult').value,reason:$('freason').value};if(type==='event')return{event_type:$('fevent').value,scope:$('fscope').value,title:$('ftitle').value,description:$('fdesc').value,effect_type:$('feffect').value,effect_magnitude:Number($('fmag').value),duration_minutes:Number($('fdur').value),affected_nation_id:$('fnid').value?Number($('fnid').value):null,affected_currency:$('fcurrency').value||null};if(type==='mission')return{user_ids:nums($('fusers').value),mission_key:$('fmission').value,override_xr:$('foverride').value?Number($('foverride').value):null};return{}}
const ep={broadcast:'/api/admin/actions/broadcast',bonus:'/api/admin/actions/give-bonus',ban:'/api/admin/actions/ban-player',unban:'/api/admin/actions/unban-player',rates:'/api/admin/actions/reset-rates',war:'/api/admin/actions/end-war',event:'/api/admin/actions/create-event',mission:'/api/admin/actions/send-mission-reward'};
function openAction(type,d){if(type==='export')return exportData();if(type==='ban'&&d?.forceUnban)type='unban';S.action={type};openModal(({broadcast:'اعلامیه عمومی',bonus:'بونوس دسته‌جمعی',ban:'مدیریت بن',unban:'آنبن بازیکن',rates:'ریست نرخ ارز',war:'پایان جنگ',event:'رویداد جهانی',mission:'جایزه ماموریت'})[type]||'اقدام',fields(type,d));$('mpreview').style.display='block';$('mexec').style.display='none';$('preview').style.display='none'}
function openModal(t,b){$('mtitle').textContent=t;$('mbody').innerHTML=b;$('overlay').classList.add('show');$('preview').style.display='none';$('mexec').style.display='none'}function closeModal(){ $('overlay').classList.remove('show');S.action=null }
async function previewAction(){try{const a=S.action;if(!a)return;const body=payload(a.type);if(a.type==='war'&&!$('fcheck').checked){throw new Error('برای پایان جنگ باید تیک تایید فعال شود')}const r=await api.post(ep[a.type]+'?confirm=false',body);a.body=body;$('preview').textContent=r.message;$('preview').style.display='block';$('mexec').style.display='block'}catch(e){toast(e.message,'err')}}
async function executeAction(){try{const a=S.action;const r=await api.post(ep[a.type]+'?confirm=true',a.body);toast(r.message,'ok');closeModal();await load()}catch(e){toast(e.message,'err')}}
async function logs(){
 const el=$('logs');el.innerHTML=skeleton('height:560px');
 try{
  const q=new URLSearchParams({page:S.logsPage,limit:50,confirm:'true'});if(S.logFilter)q.set('action_filter',S.logFilter);
  const r=await api.get('/api/admin/actions/audit-log?'+q);S.data.logs=r;
  el.innerHTML='<div class="card panel"><div class="toolbar"><select id="lf"><option value="">همه عملیات</option>'+['admin_broadcast','admin_bonus','admin_ban','admin_unban','admin_reset_rate','admin_end_war','admin_create_event','admin_mission_reward'].map(v=>'<option value="'+v+'">'+esc(v)+'</option>').join('')+'</select><label><input id="la" type="checkbox" '+(S.logAuto?'checked':'')+'> بروزرسانی خودکار هر ۱۵ ثانیه</label></div><div class="loglist">'+((r.items||[]).length?r.items.map(x=>'<div class="log"><div class="head"><b>'+esc(x.action)+'</b><span class="muted">'+timeAgo(x.at)+'</span></div><div class="muted">'+esc(x.rule_key)+' · '+esc(x.old_value||'')+' ← '+esc(x.new_value||'')+'</div><div class="muted">'+esc(x.actor_username||'سیستم')+' · '+esc(x.reason||'')+'</div></div>').join(''):'<div class="empty">لاگی وجود ندارد</div>')+'</div><div class="pagination"><button class="btn" id="lp">قبلی</button><span>'+formatNumber(r.page)+' / '+formatNumber(r.pages||0)+'</span><button class="btn" id="ln">بعدی</button></div></div>';
  $('lf').value=S.logFilter||'';$('lf').onchange=e=>{S.logFilter=e.target.value;S.logsPage=1;logs()};$('lp').onclick=()=>{if(S.logsPage>1){S.logsPage--;logs()}};$('ln').onclick=()=>{if(S.logsPage<(r.pages||1)){S.logsPage++;logs()}};
  $('la').onchange=e=>{S.logAuto=e.target.checked;if(S.logAuto){if(timers.logs)clearInterval(timers.logs);timers.logs=setInterval(()=>{if(S.section==='logs')logs()},15000)}else if(timers.logs){clearInterval(timers.logs);timers.logs=null}};
  if(S.logAuto&&!timers.logs)timers.logs=setInterval(()=>{if(S.section==='logs')logs()},15000);
 }catch(e){el.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

function exportData(){const d=S.data[S.section];if(!d){toast('داده‌ای برای گزارش وجود ندارد','err');return}const arr=Array.isArray(d)?d:(d.items||[d]);if(!arr.length){toast('داده‌ای برای گزارش وجود ندارد','err');return}const ks=[...new Set(arr.flatMap(x=>Object.keys(x||{})))];const csv=[ks.join(','),...arr.map(x=>ks.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='opex-'+S.section+'-'+Date.now()+'.csv';a.click();URL.revokeObjectURL(a.href)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('show'))closeModal()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>go(b.dataset.s));$('refresh').onclick=load;$('export').onclick=exportData;$('announce').onclick=()=>openAction('broadcast');$('mclose').onclick=closeModal;$('mcancel').onclick=closeModal;$('mpreview').onclick=previewAction;$('mexec').onclick=executeAction;$('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};if(window.Chart){Chart.defaults.color='#9090a8';Chart.defaults.borderColor='rgba(255,255,255,.08)';Chart.defaults.font.family='system-ui,sans-serif';Chart.defaults.font.size=12}renderActions();load();
</script>
