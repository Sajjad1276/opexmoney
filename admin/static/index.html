 $('support-load').onclick=async()=>{const id=Number($('support-user').value);if(!id)return;try{const t=await api.get('/api/control/support/users/'+id);$('support-detail').innerHTML='<div class="control-grid2"><div><h4>رخدادها</h4><pre class="preview">'+esc(JSON.stringify(t.events||[],null,2))+'</pre></div><div><h4>خطاها</h4><pre class="preview">'+esc(JSON.stringify(t.errors||[],null,2))+'</pre></div></div>'}catch(e){$('support-detail').textContent=e.message}};
 }catch(e){el.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
async function initSectionTreasury(){
 const el=$('treasury');el.innerHTML=skeleton('height:600px');
 try{const rows=await api.get('/api/control/treasury');S.data.treasury=rows;el.innerHTML='<div class="card panel"><div class="head"><h3>خزانه ملت‌ها</h3><span class="muted">اصلاح فقط با ثبت Audit انجام می‌شود</span></div><div class="tablewrap"><table class="table control-table"><thead><tr><th>ملت</th><th>ارز</th><th>خزانه</th><th>Balance XR</th><th>سپرده کل</th><th>آخرین سپرده</th><th></th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+esc(r.currency_code)+'</td><td>'+formatNumber(r.nation_treasury)+'</td><td>'+formatNumber(r.balance_xr)+'</td><td>'+formatNumber(r.total_deposited)+'</td><td>'+datefmt(r.last_deposit_at)+'</td><td><div class="mini-actions"><button class="btn" data-treasury="'+r.nation_id+'">اصلاح</button><button class="btn" data-treasury-log="'+r.nation_id+'">لاگ</button></div></td></tr>').join('')+'</tbody></table></div></div>';
 document.querySelectorAll('[data-treasury-log]').forEach(b=>b.onclick=async()=>{
   const id=Number(b.dataset.treasuryLog);
   try{
    const logs=await api.get('/api/control/treasury/'+id+'/logs?limit=100');
    let html='<div class="tablewrap"><table class="table control-table"><thead><tr><th>زمان</th><th>عامل</th><th>عملیات</th><th>مقدار</th><th>یادداشت</th></tr></thead><tbody>';
    if(!logs.length){html='<div class="empty">لاگی ثبت نشده است</div>';}
    else{html+=logs.map(x=>'<tr><td>'+datefmt(x.created_at)+'</td><td>'+esc(x.actor_username||"سیستم")+'</td><td>'+esc(x.action)+'</td><td>'+formatNumber(x.amount_xr)+'</td><td>'+esc(x.note||"-")+'</td></tr>').join('')+'</tbody></table></div>';}
    openCustomModal('لاگ خزانه',html,async()=>{});
   }catch(e){toast(e.message,'err')}
  });
 document.querySelectorAll('[data-treasury]').forEach(b=>b.onclick=()=>{const row=rows.find(x=>x.nation_id===Number(b.dataset.treasury));openCustomModal('اصلاح خزانه · '+esc(row.name),'<div class="field"><label>مقدار دلار (منفی یا مثبت)</label><input id="tr-amount" type="number" step="0.01" value="0"></div><div class="field"><label>دلیل</label><textarea id="tr-note"></textarea></div><div class="control-note">موجودی بعد از اصلاح نمی‌تواند منفی شود.</div>',async()=>{await api.post('/api/control/treasury/'+row.nation_id+'/adjust?confirm=true',{amount_xr:Number($('tr-amount').value),note:$('tr-note').value});toast('خزانه اصلاح شد','ok');await initSectionTreasury()})});
 }catch(e){el.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}

function exportData(){const d=S.data[S.section];if(!d){toast('داده‌ای برای گزارش وجود ندارد','err');return}const arr=Array.isArray(d)?d:(d.items||[d]);if(!arr.length){toast('داده‌ای برای گزارش وجود ندارد','err');return}const ks=[...new Set(arr.flatMap(x=>Object.keys(x||{})))];const csv=[ks.join(','),...arr.map(x=>ks.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='opex-'+S.section+'-'+Date.now()+'.csv';a.click();URL.revokeObjectURL(a.href)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('show'))closeModal()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>go(b.dataset.s));$('refresh').onclick=load;$('export').onclick=exportData;$('announce').onclick=()=>openAction('broadcast');$('mclose').onclick=closeModal;$('mcancel').onclick=closeModal;$('mpreview').onclick=previewAction;$('mexec').onclick=executeAction;$('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};if(window.Chart){Chart.defaults.color='#9090a8';Chart.defaults.borderColor='rgba(255,255,255,.08)';Chart.defaults.font.family='system-ui,sans-serif';Chart.defaults.font.size=12}renderActions();load();
</script>
