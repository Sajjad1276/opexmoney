function openTreasuryV2Modal(row){
 openModal('اصلاح خزانه · '+esc(row.name),
  '<div class="field"><label>ملت</label><input value="'+esc(row.name)+'" disabled></div>'+
  '<div class="grid2"><div class="field"><label>نوع ارز</label><select id="tr-type"><option value="usd">usd</option><option value="local">local</option></select></div>'+
  '<div class="field"><label>نوع اصلاح</label><select id="tr-kind"><option value="add">افزایش</option><option value="subtract">کاهش</option><option value="set">تنظیم مستقیم</option></select></div></div>'+
  '<div class="field"><label>مقدار</label><input id="tr-amount-v2" type="number" min="0" step="0.01"></div>'+
  '<div class="field"><label>دلیل</label><textarea id="tr-reason-v2"></textarea></div>'+
  '<label><input id="tr-affect-total" type="checkbox"> تغییر total_deposited نیز اعمال شود</label>'+
  '<div class="control-note">اصلاح خزانه total_deposited را تغییر نمی‌دهد مگر تیک زده شود.</div>');
 $('mexec').style.display='none';
 $('mpreview').style.display='block';
 $('mpreview').onclick=async function(){
  try{
   const reason=$('tr-reason-v2').value.trim();
   if(!reason){toast('دلیل الزامی است','err');return}
   const body={
    nation_id:row.nation_id,
    currency_type:$('tr-type').value,
    adjustment_type:$('tr-kind').value,
    amount:Number($('tr-amount-v2').value),
    reason:reason,
    affect_total_deposited:$('tr-affect-total').checked,
    confirm:false
   };
   const p=await api.post('/api/treasury/adjust',body);
   $('preview').textContent='موجودی فعلی: '+formatNumber(p.preview.current_balance)+' → موجودی جدید: '+formatNumber(p.preview.new_balance)+' · تغییر: '+formatNumber(p.preview.change);
   $('preview').style.display='block';
   $('mexec').style.display='block';
   $('mexec').onclick=async function(){
    try{
     await api.post('/api/treasury/adjust',{...body,confirm:true});
     toast('خزانه اصلاح شد','ok');
     closeModal();
     initSectionTreasuryV2();
    }catch(e){toast(e.message,'err')}
   };
  }catch(e){toast(e.message,'err')}
 };
}
function exportData(){const d=S.data[S.section];if(!d){toast('داده‌ای برای گزارش وجود ندارد','err');return}const arr=Array.isArray(d)?d:(d.items||[d]);if(!arr.length){toast('داده‌ای برای گزارش وجود ندارد','err');return}const ks=[...new Set(arr.flatMap(x=>Object.keys(x||{})))];const csv=[ks.join(','),...arr.map(x=>ks.map(k=>'"'+String(x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='opex-'+S.section+'-'+Date.now()+'.csv';a.click();URL.revokeObjectURL(a.href)}
document.body.classList.add('dashboard-mode');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('show'))closeModal()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>go(b.dataset.s));$('refresh').onclick=load;$('export').onclick=exportData;$('announce').onclick=()=>openAdminAction('broadcast');$('mclose').onclick=closeModal;$('mcancel').onclick=closeModal;$('mpreview').onclick=previewAction;$('mexec').onclick=executeAction;$('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};if(window.Chart){Chart.defaults.color='#9090a8';Chart.defaults.borderColor='rgba(255,255,255,.08)';Chart.defaults.font.family='system-ui,sans-serif';Chart.defaults.font.size=12}renderActions();load();
</script>
